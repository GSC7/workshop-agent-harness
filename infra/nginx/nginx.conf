# DNS interno do Docker: resolver por requisição (variável em proxy_pass). Com `upstream` fixo o
# nginx guarda o IP da api do boot e responde 502 quando o container da api é recriado.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    set $api http://api:8000;

    location = /health {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /chat {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: sem buffer para o relatório chegar incrementalmente.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
