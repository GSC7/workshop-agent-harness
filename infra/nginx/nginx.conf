# DNS interno do Docker: resolver por requisição (variável em proxy_pass). Com `upstream` fixo o
# nginx guarda o IP da api do boot e responde 502 quando o container da api é recriado.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket da UI do Langfuse: Upgrade só quando o cliente pede.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    set $api http://api:8000;

    location = /health {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /chat {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: sem buffer para o relatório chegar incrementalmente.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

# UI do Langfuse (#11, ADR 0014): 2º server no mesmo nginx — ele não roda sob subcaminho sem
# build próprio. A api manda os traces direto pela rede interna, não por aqui.
server {
    listen 3000;
    set $langfuse http://langfuse-web:3000;

    location / {
        proxy_pass $langfuse;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 20m;
    }
}
