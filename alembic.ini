# Migrations de infraestrutura (papéis, schema harness). Rodam no host com a conexão admin:
#   uv run alembic upgrade head
# A URL vem de app.config.settings (DATABASE_URL do .env), não deste arquivo.

[alembic]
script_location = infra/db/migrations
prepend_sys_path = backend

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
