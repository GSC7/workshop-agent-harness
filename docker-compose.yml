# Agente Analítico de Vendas — esqueleto andante (issue #1).
# Cadeia: nginx (único exposto) -> api (FastAPI) -> postgres (vazio).
# RNF-05: sobe via `docker compose up -d`. Antes: `cp .env.example .env` e ajuste os segredos.
# Stores: postgres (schema negocio via seed/), qdrant (3 coleções) e minio (corpus bruto).

name: workshop

# Langfuse v4 (observabilidade, #11 — ADR 0014): stack PRÓPRIO, isolado dos stores do agente
# (postgres/minio do negocio não são tocados). Nenhum serviço publica porta: a UI sai pelo nginx.
# Segredos com prefixo LANGFUSE_ (POSTGRES_*/MINIO_* já são do workshop na interpolação).
x-langfuse-env: &langfuse-env
  # Login só por http://localhost:<porta>: outro host/IP quebra o callback do NextAuth.
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_PG_PASSWORD:?defina LANGFUSE_PG_PASSWORD no .env}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?defina LANGFUSE_SALT no .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?defina LANGFUSE_ENCRYPTION_KEY no .env (openssl rand -hex 32)}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?defina LANGFUSE_CLICKHOUSE_PASSWORD no .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?defina LANGFUSE_MINIO_PASSWORD no .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  # Mídia só pelo endpoint interno: o MinIO do Langfuse não é exposto ao host.
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?defina LANGFUSE_REDIS_AUTH no .env}

x-langfuse-depends: &langfuse-depends
  langfuse-postgres:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy

services:
  postgres:
    image: postgres:17
    container_name: workshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshop}
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workshop} -d ${POSTGRES_DB:-workshop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest          # (pinar versão em produção — RNF-05)
    container_name: workshop-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"       # REST/HTTP
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: cgr.dev/chainguard/minio:latest  # minio/minio saiu do Docker Hub (pinar versão em produção — RNF-05)
    container_name: workshop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"           # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Console web
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: workshop-api
    restart: unless-stopped
    # Chaves (ANTHROPIC/OPENAI/AGENTE_RO/LANGFUSE_PUBLIC/SECRET_KEY) vêm do .env. `environment` abaixo
    # tem precedência sobre env_file e fixa os hosts internos da rede do compose.
    env_file:
      - .env
    environment:
      # A API só fala com o schema negocio como agente_ro (somente-leitura). Sem conexão admin.
      DATABASE_URL: ""
      DATABASE_URL_RO: postgresql+asyncpg://agente_ro:${AGENTE_RO_PASSWORD:?defina AGENTE_RO_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-workshop}
      # Runs do agente (schema harness) por papel próprio: só INSERT/SELECT em harness.runs.
      DATABASE_URL_HARNESS: postgresql+asyncpg://harness_rw:${HARNESS_RW_PASSWORD:?defina HARNESS_RW_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-workshop}
      QDRANT_URL: http://qdrant:6333
      # Host interno do MinIO (o .env usa localhost:9000, válido só fora do compose).
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_RELATORIOS: ${MINIO_BUCKET_RELATORIOS:-relatorios}
      # Traces pela rede interna; sem depends_on: Langfuse fora não impede a api de subir (#11).
      LANGFUSE_HOST: http://langfuse-web:3000
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    # sem porta publicada: o acesso externo é só pelo nginx (prova o hop da issue #1)
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    # Única porta exposta: serve a SPA (React + Vite, build multi-stage) e faz proxy da api
    # na mesma origem — o frontend nunca fala com serviços internos.
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: workshop-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
      # UI de admin do Langfuse (2º server do nginx, ADR 0014): só no loopback do host.
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: workshop-langfuse-web
    restart: unless-stopped
    depends_on: *langfuse-depends
    expose:
      - "3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?defina LANGFUSE_NEXTAUTH_SECRET no .env}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Init headless no 1º boot: org, projeto (com as chaves que a api usa) e usuário admin.
      LANGFUSE_INIT_ORG_ID: workshop
      LANGFUSE_INIT_ORG_NAME: Workshop
      LANGFUSE_INIT_PROJECT_ID: agente-analitico
      LANGFUSE_INIT_PROJECT_NAME: Agente Analítico de Vendas
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?defina LANGFUSE_PUBLIC_KEY no .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?defina LANGFUSE_SECRET_KEY no .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?defina LANGFUSE_INIT_USER_EMAIL no .env}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?defina LANGFUSE_INIT_USER_PASSWORD no .env}

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: workshop-langfuse-worker
    restart: unless-stopped
    depends_on: *langfuse-depends
    expose:
      - "3030"
    environment:
      <<: *langfuse-env

  langfuse-postgres:
    image: postgres:17
    container_name: workshop-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: workshop-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: workshop-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    # cria o bucket 'langfuse' antes de subir o servidor
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-redis:
    image: redis:7
    container_name: workshop-langfuse-redis
    restart: unless-stopped
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

volumes:
  pg_data:
  qdrant_data:
  minio_data:
  langfuse_pg_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
